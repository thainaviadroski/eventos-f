<div class="wrapper-action">
	<h2>Eventos:</h2>
	<button matButton="filled" color="primary" (click)="openDialog()">
		<mat-icon>add</mat-icon>Novo Evento
	</button>
</div>

<mat-form-field class="busca" appearance="outline" subscriptSizing="dynamic">
	<mat-icon matPrefix>search</mat-icon>
	<mat-label>Buscar eventos</mat-label>
	<input matInput [formControl]="busca" placeholder="Ex: Semana Acadêmica">
	@if (busca.value) {
	<button matSuffix mat-icon-button aria-label="Limpar busca" (click)="limparBusca()">
		<mat-icon>close</mat-icon>
	</button>
	}
</mat-form-field>

<div class="wrapper-list">
	@if(eventos.length !== 0) {
	<h3>Eventos Cadastrados:</h3>
	<div class="content">
		@for(evento of eventos; track evento.id) {
		<app-eventos-itens-component [evento]="evento" (viewDetail)="onDetail(evento.id)"
			(editEvento)="openDialog(evento)" (deleteEvento)="onDelete(evento)">
		</app-eventos-itens-component>
		}
	</div>
	}

	<mat-paginator [length]="totalElements" [pageIndex]="page" [pageSize]="size" [pageSizeOptions]="pageSizeOptions"
		(page)="onPageChange($event)" aria-label="Selecionar página">
	</mat-paginator>

	@if(eventos.length === 0) {
		@if (termo) {
		<p>Nenhum evento encontrado para "{{ termo }}".</p>
		} @else {
		<p>Sem eventos cadastrados!</p>
		}
	}
</div>
