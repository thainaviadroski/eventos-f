<div class="certificado">
	<p>{{certificado.id}}</p>
	<p>{{certificado.tipoCertifica}}</p>
	<p>{{certificado.descricao}}</p>
	<p>{{certificado.created | date: 'dd/MM/yyyy HH:mm' }}</p>

	<div class="action">
		<button class="btn-icon btn-icon-ghost-primary" matTooltip="Importar acadêmicos"
			[matTooltipShowDelay]="toolTipOptions.showDelay" [matTooltipHideDelay]="toolTipOptions.hideDelay"
			(click)="onView()">
			<mat-icon>group_add</mat-icon>
		</button>
		<button class="btn-icon btn-icon-ghost-primary" matTooltip="Editar Certificado"
			[matTooltipShowDelay]="toolTipOptions.showDelay" [matTooltipHideDelay]="toolTipOptions.hideDelay"
			(click)="onEdit()">
			<mat-icon>edit</mat-icon>
		</button>
		<button class="btn-icon btn-icon-ghost-danger" matTooltip="Excluir Certificado"
			[matTooltipShowDelay]="toolTipOptions.showDelay" [matTooltipHideDelay]="toolTipOptions.hideDelay">
			<mat-icon>delete</mat-icon>
		</button>
	</div>
</div>
