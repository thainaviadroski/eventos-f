<div class="dialog-header" mat-dialog-title>
	<span>Pré-visualização do certificado</span>
	<button mat-icon-button mat-dialog-close aria-label="Fechar">
		<mat-icon>close</mat-icon>
	</button>
</div>

<mat-dialog-content>
	<p class="hint">Simulação com dados fictícios — não representa um acadêmico real.</p>

	<div class="certificado-preview"
		[style.backgroundImage]="fundoUrl ? 'url(' + fundoUrl + ')' : null">
		<div class="preview-overlay">
			<p class="preview-tipo">{{ tipoCertificaNome }}</p>
			<p class="preview-cabecalho">{{ previewCabecalho }}</p>
			<p class="preview-nome">{{ academicoExemplo.nome }}</p>
			<p class="preview-corpo">{{ previewCorpo }}</p>
			<p class="preview-rodape">{{ previewRodape }}</p>
			<p class="preview-ch">CH: {{ academicoExemplo.ch }}h</p>
		</div>
	</div>

	@if (versoUrl) {
	<div class="verso-wrapper">
		<h4>Verso</h4>
		<img class="verso-imagem" [src]="versoUrl" alt="Imagem do verso do certificado">
	</div>
	}
</mat-dialog-content>

<mat-divider></mat-divider>

<mat-dialog-actions align="end">
	<button mat-button mat-dialog-close>Fechar</button>
</mat-dialog-actions>
